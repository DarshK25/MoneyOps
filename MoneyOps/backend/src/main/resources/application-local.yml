# Local development profile — run the stack against locally-hosted infra
# (Redis + Kafka from docker-compose on localhost, a local mongod), while
# leaving Postgres pointed at whatever DATABASE_URL resolves to.
#
# Activate with either:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#   java -jar app.jar --spring.profiles.active=local
#
# Contains only local endpoints and no secrets, so it is safe to commit.
spring:
  kafka:
    enabled: true
    bootstrap-servers: localhost:9092
    # NOTE: the local docker broker speaks PLAINTEXT, but the base application.yml
    # resolves security.protocol from ${KAFKA_SECURITY_PROTOCOL:...} and spring-dotenv
    # loads the root .env (KAFKA_SECURITY_PROTOCOL=SASL_SSL for the managed cloud broker)
    # at a precedence ABOVE this profile — so a `spring.kafka.properties.security.protocol`
    # key here does NOT win. Run the local dev backend with the env var set instead:
    #   KAFKA_SECURITY_PROTOCOL=PLAINTEXT mvn spring-boot:run -Dspring-boot.run.profiles=local
    # (the dockerised backend gets this via docker-compose's environment: block.)
  data:
    mongodb:
      # Local mongod instead of the unreachable cloud Atlas cluster.
      uri: mongodb://localhost:27017/moneyops
  redis:
    host: localhost
    port: 6379
