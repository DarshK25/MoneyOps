services:
  redis:
    image: redis:7-alpine
    container_name: moneyops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moneyops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: moneyops-api-gateway
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      BACKEND_CORE_URL: http://backend:8000
      AI_GATEWAY_URL: http://ai-gateway:8005
      VOICE_SERVICE_URL: http://voice-service:8003
    depends_on:
      - backend
      - ai-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    container_name: moneyops-ai-gateway
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      BACKEND_BASE_URL: http://backend:8000
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8005/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  voice-service:
    build:
      context: ./voice-service
      dockerfile: Dockerfile
    container_name: moneyops-voice-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      AI_GATEWAY_URL: http://ai-gateway:8005
    depends_on:
      ai-gateway:
        condition: service_started

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: moneyops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai-gateway

  email-worker:
    build:
      context: ./scripts/workers
      dockerfile: Dockerfile.email
    container_name: moneyops-email-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./scripts/workers:/app

  notification-worker:
    build:
      context: ./scripts/workers
      dockerfile: Dockerfile.notification
    container_name: moneyops-notification-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./scripts/workers:/app

volumes:
  redis_data:
    driver: local
