services:
  redis:
    image: redis:7-alpine
    container_name: moneyops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: moneyops-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "/etc/confluent/docker/healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: moneyops-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moneyops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "50051:50051"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: moneyops-api-gateway
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      BACKEND_CORE_URL: http://backend:8000
      AI_GATEWAY_URL: http://ai-gateway:8005
      VOICE_SERVICE_URL: http://voice-service:8003
    depends_on:
      - backend
      - ai-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    container_name: moneyops-ai-gateway
    restart: unless-stopped
    ports:
      - "8005:8005"
      - "50052:50052"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      BACKEND_BASE_URL: http://backend:8000
      GRPC_SERVER_PORT: "50052"
      GRPC_CLIENT_HOST: backend
      GRPC_CLIENT_PORT: "50051"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8005/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  voice-service:
    build:
      context: ./voice-service
      dockerfile: Dockerfile
    container_name: moneyops-voice-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      AI_GATEWAY_URL: http://ai-gateway:8005
      # Must not undercut the gateway's real pipeline latency, or working turns
      # get killed mid-flight and the caller hears the canned fallback. Kept in
      # step with the voice-service default in config.py.
      AI_GATEWAY_TIMEOUT: "30"
    depends_on:
      ai-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8003/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: moneyops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai-gateway

  email-worker:
    build:
      context: ./scripts/workers
      dockerfile: Dockerfile.email
    container_name: moneyops-email-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./scripts/workers:/app

  notification-worker:
    build:
      context: ./scripts/workers
      dockerfile: Dockerfile.notification
    container_name: moneyops-notification-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./scripts/workers:/app

volumes:
  redis_data:
    driver: local
