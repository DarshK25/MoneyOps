# ===================================================================
# MoneyOps API Gateway - Main Configuration
# ===================================================================

spring:
  application:
    name: api-gateway

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      httpclient:
        follow-redirects: false

      routes:
        - id: auth-login
          uri: ${backend.core.url}
          predicates:
            - Path=/api/auth/login,/api/auth/register
          filters:
            - name: RateLimitFilter
              args:
                key: "ip:auth"
                limit: 10
                windowSeconds: 60

        - id: oauth2
          uri: ${backend.core.url}
          predicates:
            - Path=/oauth2/**,/login/**

        - id: ai-gateway
          uri: ${ai.gateway.url}
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=0
            - name: RateLimitFilter
              args:
                key: "user:ai"
                limit: 20
                windowSeconds: 60

        - id: backend-api
          uri: ${backend.core.url}
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=0
            - name: RateLimitFilter
              args:
                key: "user:api"
                limit: 100
                windowSeconds: 60

        - id: voice-service
          uri: ${voice.service.url}
          predicates:
            - Path=/voice/**
          filters:
            - StripPrefix=0
            - name: RateLimitFilter
              args:
                key: "user:voice"
                limit: 30
                windowSeconds: 60

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

  main:
    web-application-type: reactive

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000}

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

gateway:
  public-endpoints: ${GATEWAY_PUBLIC_ENDPOINTS:/api/auth/login,/api/auth/register,/actuator/health,/actuator/ready,/oauth2,/oauth2/**,/login,/login/**}
  tenant:
    enforce-isolation: ${TENANT_ENFORCE_ISOLATION:true}
    required-paths: ${TENANT_REQUIRED_PATHS:/api/clients/**,/api/invoices/**,/api/payments/**,/api/organizations/**}
  logging:
    enabled: ${GATEWAY_LOGGING_ENABLED:true}
    log-request-body: ${GATEWAY_LOG_REQUEST_BODY:false}
    log-response-body: ${GATEWAY_LOG_RESPONSE_BODY:false}
    slow-request-threshold-ms: ${GATEWAY_SLOW_REQUEST_THRESHOLD:3000}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}

backend:
  core:
    url: ${BACKEND_CORE_URL:http://localhost:8000}

ai:
  gateway:
    url: ${AI_GATEWAY_URL:http://localhost:8005}

voice:
  service:
    url: ${VOICE_SERVICE_URL:http://localhost:5001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    redis:
      enabled: false

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.moneyops.gateway: ${LOG_LEVEL_GATEWAY:DEBUG}
    org.springframework.cloud.gateway: ${LOG_LEVEL_CLOUD_GATEWAY:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: ${PORT:8002}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
